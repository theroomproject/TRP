name: Deploy TRP website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Generate standalone TRP room JPEGs
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('assets/images/trp-originals-master.jpg')
          out = Path('assets/room-types')
          out.mkdir(parents=True, exist_ok=True)

          im = Image.open(src).convert('RGB')
          w, h = im.size
          tw, th = w // 4, h // 3

          tiles = {
              'gaming.jpg': (0, 0),
              'luxury.jpg': (1, 0),
              'prayer.jpg': (2, 0),
              'zen.jpg': (3, 0),
              'cinema.jpg': (0, 1),
              'creator.jpg': (1, 1),
              'office.jpg': (2, 1),
              'kids.jpg': (3, 1),
              'jungle.jpg': (0, 2),
              'tropical.jpg': (1, 2),
              'pastel.jpg': (2, 2),
              'sports.jpg': (3, 2),
          }

          for name, (x, y) in tiles.items():
              crop = im.crop((x*tw, y*th, (x+1)*tw, (y+1)*th))
              crop.save(out / name, 'JPEG', quality=92, optimize=True, progressive=True)
              print(f'{name}: {crop.size}')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
