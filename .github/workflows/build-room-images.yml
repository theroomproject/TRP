name: Generate standalone TRP room images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-room-images.yml'

permissions:
  contents: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Crop master image into standalone JPEGs
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('assets/images/trp-originals-master.jpg')
          out = Path('assets/room-types')
          out.mkdir(parents=True, exist_ok=True)

          im = Image.open(src).convert('RGB')
          w, h = im.size
          tw, th = w // 4, h // 3

          tiles = {
              'gaming.jpg': (0, 0),
              'luxury.jpg': (1, 0),
              'prayer.jpg': (2, 0),
              'zen.jpg': (3, 0),
              'cinema.jpg': (0, 1),
              'creator.jpg': (1, 1),
              'office.jpg': (2, 1),
              'kids.jpg': (3, 1),
              'jungle.jpg': (0, 2),
              'tropical.jpg': (1, 2),
              'pastel.jpg': (2, 2),
              'sports.jpg': (3, 2),
          }

          for name, (x, y) in tiles.items():
              crop = im.crop((x*tw, y*th, (x+1)*tw, (y+1)*th))
              crop.save(out / name, 'JPEG', quality=92, optimize=True, progressive=True)
              print(name, crop.size)
          PY

      - name: Commit generated JPEGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/room-types/*.jpg
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
          else
            git commit -m 'Generate standalone TRP room JPEGs'
            git push
          fi
